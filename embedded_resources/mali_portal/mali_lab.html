<!-- AP="Mali Lab" -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mali Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #070607;
        --panel: #100a0d;
        --field: #090708;
        --border: #722039;
        --accent: #a61f48;
        --accent-light: #e44d79;
        --text: #f7edf1;
        --muted: #d2bcc4;
        --success: #79dfa5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 18px;
        place-items: center;
        background: var(--background);
        color: var(--text);
        font: 15px system-ui, sans-serif;
      }

      .card {
        width: min(100%, 430px);
        border: 1px solid var(--border);
        background: var(--panel);
        box-shadow: 0 18px 50px #0008;
      }

      .head {
        padding: 18px;
        border-bottom: 3px solid var(--accent);
      }

      .head b {
        display: block;
        color: var(--accent-light);
        letter-spacing: 0.16em;
      }

      .body {
        padding: 18px;
      }

      h1 {
        margin: 0.35rem 0;
        font-size: 27px;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      .notice {
        padding: 11px;
        border-left: 3px solid var(--accent-light);
        background: #1b0d13;
      }

      label {
        display: block;
        margin: 14px 0 5px;
        color: #e7c9d3;
      }

      input,
      button {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        background: var(--field);
        color: #fff;
      }

      button {
        margin-top: 15px;
        background: var(--accent);
        font-weight: 700;
        cursor: pointer;
      }

      .ok {
        min-height: 1.4em;
        color: var(--success);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="head">
        <b>MALI PORTAL</b>
        <h1>Laboratorio local</h1>
      </header>
      <section class="body">
        <p class="notice">
          Pagina educativa para equipamentos proprios e ambientes autorizados.
          Nao informe senhas nem dados reais.
        </p>
        <form id="lab">
          <label for="nick">Nome ou apelido de teste</label>
          <input id="nick" maxlength="32" autocomplete="off" />

          <label for="code">Codigo ficticio do laboratorio</label>
          <input id="code" maxlength="24" autocomplete="off" />

          <button type="submit">VALIDAR LOCALMENTE</button>
        </form>
        <p id="result" class="ok" role="status"></p>
      </section>
    </main>
    <script>
      document.getElementById("lab").addEventListener("submit", function (event) {
        event.preventDefault();
        document.getElementById("result").textContent =
          "Teste local concluido. Nenhum dado foi enviado ou armazenado.";
        this.reset();
      });
    </script>
  </body>
</html>
